<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScriptGuard pharmacist dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F4;--panel:#FFFFFF;--ink:#16232B;--muted:#5B6B73;--line:#D9E0DE;
  --accent:#1F5E7A;--accent-bg:#E3EEF3;
  --high:#B3261E;--high-bg:#FCEAE8;--low:#8A5A00;--low-bg:#FBF1DC;
  --ok:#2E6B4A;--ok-bg:#E5F2EA;--wait:#5B6B73;--wait-bg:#ECEFEE;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F161A;--panel:#172127;--ink:#E6ECEE;--muted:#9AAAB1;--line:#2A363D;
    --accent:#6FB3D2;--accent-bg:#17303C;
    --high:#F2A49E;--high-bg:#3A1D1B;--low:#E8C27A;--low-bg:#33280F;
    --ok:#8FD1AC;--ok-bg:#17301F;--wait:#9AAAB1;--wait-bg:#1F2A30;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161A;--panel:#172127;--ink:#E6ECEE;--muted:#9AAAB1;--line:#2A363D;
  --accent:#6FB3D2;--accent-bg:#17303C;
  --high:#F2A49E;--high-bg:#3A1D1B;--low:#E8C27A;--low-bg:#33280F;
  --ok:#8FD1AC;--ok-bg:#17301F;--wait:#9AAAB1;--wait-bg:#1F2A30;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-0.01em}
.brand span{color:var(--muted);font-size:14px}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.switch button{background:none;border:0;padding:7px 14px;font-size:14px;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);font-weight:500}

.wrap{max-width:1180px;margin:0 auto;padding:20px 24px 40px}
.grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}

.queue{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.queue h2{font-size:14px;font-weight:500;color:var(--muted);margin:0;padding:12px 16px;border-bottom:1px solid var(--line)}
.qitem{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 16px}
.qitem:last-child{border-bottom:0}
.qitem[aria-current="true"]{background:var(--accent-bg)}
.qtok{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.qname{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qsub{font-size:12px;color:var(--muted)}

.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-high{background:var(--high-bg);color:var(--high)}
.p-low{background:var(--low-bg);color:var(--low)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-wait{background:var(--wait-bg);color:var(--wait)}
.p-review{background:var(--low-bg);color:var(--low)}

.case{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
.head{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.token{font-size:64px;line-height:0.9;font-weight:600;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;color:var(--accent)}
.who h2{margin:0;font-size:20px;font-weight:500}
.who p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sources{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.sources b{font-weight:500;color:var(--ink)}

.summary{margin:18px 0 8px;font-size:15px}
.flag{border:1px solid var(--line);border-radius:8px;margin-top:12px;overflow:hidden}
.flag.high{border-left:4px solid var(--high);border-radius:0 8px 8px 0}
.flag.low{border-left:4px solid var(--low);border-radius:0 8px 8px 0}
.fhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px 4px}
.fdrug{font-weight:500;text-transform:capitalize}
.fexp{padding:0 14px 12px;margin:0;color:var(--ink)}
.compare{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
@media (max-width:560px){.compare{grid-template-columns:1fr}}
.compare div{padding:10px 14px}
.compare div+div{border-left:1px solid var(--line)}
@media (max-width:560px){.compare div+div{border-left:0;border-top:1px solid var(--line)}}
.compare small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.src{font-family:var(--mono);font-size:13px}
.src.none{font-family:var(--sans);color:var(--high);font-style:italic}
.fcheck{display:flex;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}

.note{background:var(--bg);border-radius:8px;padding:14px 16px;margin-top:16px;color:var(--muted)}
.decide{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.decide label{display:block;font-weight:500;margin-bottom:6px}
.decide textarea{width:100%;min-height:72px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);resize:vertical}
.err{color:var(--high);font-size:13px;margin:6px 0 0;min-height:1em}
.btn{background:var(--accent);color:var(--panel);border:0;border-radius:8px;padding:9px 18px;font-weight:500;margin-top:8px}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.metric b{display:block;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.metric span{font-size:13px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px}
.panel h2{font-size:16px;font-weight:500;margin:0 0 4px}
.panel p.lead{margin:0 0 14px;color:var(--muted);font-size:14px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.tok{font-weight:600;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:220px minmax(0,1fr) 32px;gap:12px;align-items:center;font-size:14px}
@media (max-width:560px){.bar{grid-template-columns:1fr 32px}.bar .track{grid-column:1/-1}}
.track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.rowhead h2{margin:0;font-size:20px;font-weight:500}
.rowhead p{margin:2px 0 0;color:var(--muted);font-size:14px}
@media print{.top,.btn{display:none}body{background:#fff}}
@media (prefers-reduced-motion:no-preference){.case{animation:in .18s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
<style>
.toplinks{display:flex;gap:12px;align-items:center}.toplinks a{color:var(--accent);font-size:14px;text-decoration:none}
.agentbox{background:var(--wait-bg);border-radius:8px;padding:12px;margin:12px 0;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.btn.small{padding:6px 12px;font-size:13px}
.sandbox{font-size:13px;color:var(--muted);margin:8px 0 0}.sandbox b{color:var(--ink);font-weight:500}
.callbar{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between}
</style>
</head>
