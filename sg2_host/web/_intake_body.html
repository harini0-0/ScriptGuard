<body>
<header class="top"><div class="brand"><h1>ScriptGuard</h1><span>Discharge desk: submit documents</span></div></header>
<main class="wrap">
<section class="panel" style="max-width:820px">
  <h2>New discharge check</h2><p class="lead">For each document, upload a file (PDF, scan, phone photo, or .txt) or paste its text. The patient gets a token.</p>
  <form id="f" onsubmit="submitForm(event)">
    <div class="decide" style="border:0;padding:0">
      <label for="name">Patient name</label><input id="name" name="name" required style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)">
      <label for="mrn" style="margin-top:10px">MRN</label><input id="mrn" name="mrn" required style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)">
      <label for="s" style="margin-top:14px">Discharge summary: upload a file</label><input id="s" name="discharge_summary" type="file" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.txt"><label for="st" style="margin-top:6px">...or paste the text</label><textarea id="st" name="discharge_summary_text" style="width:100%;min-height:110px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:13px" placeholder="Paste the discharge medication section here"></textarea>
      <label for="p" style="margin-top:14px">Prescription: upload a file</label><input id="p" name="prescription" type="file" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.txt"><label for="pt" style="margin-top:6px">...or paste the text</label><textarea id="pt" name="prescription_text" style="width:100%;min-height:110px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:13px" placeholder="Paste the prescription here"></textarea>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" id="go" type="submit">Get token</button>
    </div>
  </form>
  <div id="out"></div>
</section>
<section class="panel" style="max-width:820px">
  <h2>Demo cases</h2><p class="lead">Synthetic documents only (fictional hospitals and patients).</p>
  <div class="row"><select id="demo" style="padding:8px;border-radius:8px"></select><button class="btn small" onclick="demo()">Queue demo case</button></div>
  <div id="dout"></div>
</section>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function show(el, r){ document.getElementById(el).innerHTML = `<div class="head" style="margin-top:16px"><div class="token">${r.token}</div><div class="who"><h2>Token issued</h2><p>${esc(r.sources.map(s => s.doc + ": " + s.how).join(" | "))}. Stored in ${esc(r.store)}.</p></div></div>`; }
async function submitForm(ev){
  ev.preventDefault(); const e = document.getElementById("err"), b = document.getElementById("go");
  for (const [f, t, label] of [["s", "st", "discharge summary"], ["p", "pt", "prescription"]]) {
    if (!document.getElementById(f).files.length && !document.getElementById(t).value.trim()) {
      e.textContent = `Add the ${label}: upload a file or paste its text.`; return; } }
  b.disabled = true; e.textContent = "Reading the documents (scanned files take 10 to 30 seconds; pasted text is instant)...";
  try { const r = await fetch("/api/intake", {method:"POST", body:new FormData(document.getElementById("f"))}); const j = await r.json();
    if (!r.ok) throw new Error(j.error); e.textContent = ""; show("out", j); document.getElementById("f").reset();
  } catch (x) { e.textContent = x.message; } b.disabled = false;
}
async function loadDemos(){ const j = await (await fetch("/api/demos")).json();
  document.getElementById("demo").innerHTML = j.demos.map(d => `<option value="${d.id}">${esc(d.label)}</option>`).join(""); }
async function demo(){ const id = document.getElementById("demo").value;
  const r = await fetch("/api/demo", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({id})}); const j = await r.json();
  if (!r.ok) { document.getElementById("dout").textContent = j.error; return; } show("dout", j); }
loadDemos();
</script>
</body></html>
