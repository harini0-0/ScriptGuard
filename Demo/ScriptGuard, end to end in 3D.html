<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScriptGuard, end to end in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DCE4E2;--panel:rgba(255,255,255,0.94);--ink:#16232B;--muted:#5B6B73;--line:#D9E0DE;
  --accent:#1F5E7A;--accent-bg:#E3EEF3;--code:#F1F4F3;--high:#B3261E;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1115;--panel:rgba(23,33,39,0.94);--ink:#E6ECEE;--muted:#9AAAB1;--line:#2A363D;
    --accent:#6FB3D2;--accent-bg:#17303C;--code:#0F161A;--high:#F2A49E;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1115;--panel:rgba(23,33,39,0.94);--ink:#E6ECEE;--muted:#9AAAB1;--line:#2A363D;
  --accent:#6FB3D2;--accent-bg:#17303C;--code:#0F161A;--high:#F2A49E;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;right:16px;pointer-events:none}
.hud h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em}
.hud p{margin:2px 0 0;color:var(--muted);font-size:14px}

.panel{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(450px,calc(100% - 32px));
  max-height:min(62vh,640px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chip{background:var(--accent-bg);color:var(--accent);border-radius:999px;padding:1px 10px;font-weight:500}
.panel h2{margin:6px 0 6px;font-size:19px;font-weight:600;letter-spacing:-0.01em;line-height:1.3}
.panel p.body{margin:0 0 10px;font-size:15px}
pre{margin:0 0 10px;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font-family:var(--mono);font-size:12.5px;line-height:1.55;overflow-x:auto;white-space:pre}
ol.steps{margin:0 0 10px;padding-left:22px;font-size:14px}
ol.steps li{padding:3px 0;color:var(--muted)}
ol.steps li.on{color:var(--ink);font-weight:500}
ol.steps li.on::marker{color:var(--accent)}
.controls{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.controls button.b{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px}
.controls button.primary{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:500}
.dots{display:flex;gap:6px;margin-left:auto}
.dots button{width:12px;height:12px;border-radius:50%;border:1px solid var(--muted);background:none;padding:0}
.dots button[aria-current="true"]{background:var(--accent);border-color:var(--accent)}
.fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:640px){
  .hud h1{font-size:17px}.hud p{display:none}
  .panel{max-height:48vh;padding:14px}
  .panel h2{font-size:17px}
}
</style>
</head>
<body>
<canvas id="scene" aria-label="3D scene of a patient's discharge papers moving through ScriptGuard"></canvas>
<div class="hud"><h1>ScriptGuard, end to end</h1><p>Token T-042: Mary's papers from the kiosk to the pharmacist</p></div>
<section class="panel" aria-live="polite">
  <div class="meta"><span id="count"></span><span class="chip" id="where"></span><span id="docstage"></span></div>
  <h2 id="ttl"></h2>
  <p class="body" id="body"></p>
  <div id="extra"></div>
  <div class="controls">
    <button class="b" id="prev" aria-label="Previous stage">Back</button>
    <button class="b primary" id="play">Pause</button>
    <button class="b" id="next" aria-label="Next stage">Next</button>
    <div class="dots" id="dots" role="group" aria-label="Jump to stage"></div>
  </div>
</section>
<div class="fail" id="fail">The 3D view couldn't load in this browser. Try a recent version of Chrome, Edge, Safari or Firefox.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(typeof THREE==="undefined"){document.getElementById("fail").style.display="flex";return;}

const SANS="'IBM Plex Sans', system-ui, sans-serif", MONO="'IBM Plex Mono', ui-monospace, monospace";
const isDark=()=>{const t=document.documentElement.dataset.theme;if(t==="dark")return true;if(t==="light")return false;return matchMedia("(prefers-color-scheme: dark)").matches;};

/* ---------- renderer ---------- */
const canvas=document.getElementById("scene");
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){document.getElementById("fail").style.display="flex";return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,1,0.1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x6d7a75,0.62));
const sun=new THREE.DirectionalLight(0xffffff,1.05);sun.position.set(26,24,18);sun.target.position.set(18,0,0);scene.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-26,right:26,top:14,bottom:-14,near:1,far:80});sun.shadow.bias=-0.0006;
const rim=new THREE.DirectionalLight(0xcfe6ff,0.45);rim.position.set(6,10,-16);scene.add(rim);

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.7,metalness:0.05},o||{}));
const P=(x,y,z)=>new THREE.Vector3(x,y,z);
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const seg=(t,a,b)=>ease((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function makeCanvas(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return {c,t,w,h,ctx:c.getContext("2d"),draw(fn){this.ctx.clearRect(0,0,w,h);fn(this.ctx,w,h);this.t.needsUpdate=true;}};}
function wrap(x,text,X,Y,maxW,lh){const words=text.split(" ");let line="";for(const w of words){const test=line?line+" "+w:w;if(x.measureText(test).width>maxW&&line){x.fillText(line,X,Y);Y+=lh;line=w;}else line=test;}if(line)x.fillText(line,X,Y);return Y;}

/* ---------- world ---------- */
const floorMat=M(0xC5D1CE,{roughness:1});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(90,40),floorMat);floor.rotation.x=-Math.PI/2;floor.position.set(18,0,0);scene.add(floor);
const railMat=new THREE.MeshBasicMaterial({color:0x0E4A66,transparent:true,opacity:0.6});
const rail=new THREE.Mesh(new THREE.PlaneGeometry(40,0.22),railMat);rail.rotation.x=-Math.PI/2;rail.position.set(18.5,0.012,2.4);scene.add(rail);
function zone(x,w,color){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,6),new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.36}));m.rotation.x=-Math.PI/2;m.position.set(x,0.006,0);scene.add(m);return m;}

function label(text,sub,width){
  const h=sub?150:96;const cv=makeCanvas(560,h);
  const fn=(x,w,H)=>{x.fillStyle="rgba(255,255,255,0.95)";rr(x,4,4,w-8,H-8,20);x.fill();x.strokeStyle="rgba(22,35,43,0.18)";x.lineWidth=2;x.stroke();
    x.textAlign="center";x.textBaseline="middle";x.fillStyle="#16232B";x.font=`600 40px ${SANS}`;x.fillText(text,w/2,sub?54:H/2);
    if(sub){x.fillStyle="#5B6B73";x.font=`400 30px ${SANS}`;x.fillText(sub,w/2,106);}};
  cv.draw(fn);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:cv.t,transparent:true,depthWrite:false}));
  const W=width||2.6;s.scale.set(W,W*h/560,1);s.userData.cv=cv;s.userData.redraw=()=>cv.draw(fn);return s;
}

function person(o){
  const g=new THREE.Group();
  const skin=M(o.skin,{roughness:0.5}),top=M(o.top,{roughness:0.6}),bottom=M(o.bottom,{roughness:0.75}),
        shoe=M(0x15191C,{roughness:0.4}),hairM=M(o.hair,{roughness:0.85}),eyeM=M(0x1A1410,{roughness:0.3});
  const legGeo=new THREE.CylinderGeometry(0.075,0.062,0.78,16);legGeo.translate(0,-0.39,0);
  const legL=new THREE.Mesh(legGeo,o.dress?skin:bottom);legL.position.set(-0.1,0.82,0);
  const legR=new THREE.Mesh(legGeo,o.dress?skin:bottom);legR.position.set(0.1,0.82,0);
  [legL,legR].forEach(l=>{const sh=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.07,0.25),shoe);sh.position.set(0,-0.76,0.05);l.add(sh);});
  g.add(legL,legR);
  if(o.dress){const sk=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.34,0.62,24),bottom);sk.position.y=0.83;g.add(sk);}
  else{const hips=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.24,20),bottom);hips.position.y=0.9;g.add(hips);}
  if(o.coat){const coat=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.31,0.92,24),top);coat.position.y=1.0;g.add(coat);
    const badge=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.1,0.02),M(0x1F5E7A));badge.position.set(0.12,1.36,0.25);g.add(badge);}
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.2,0.6,24),o.inner?M(o.inner):top);torso.position.y=1.25;g.add(torso);
  if(o.coat){const lap=new THREE.Mesh(new THREE.CylinderGeometry(0.258,0.208,0.6,24,1,true,Math.PI*0.14,Math.PI*1.72),M(0xF7F9FA,{side:THREE.DoubleSide}));lap.position.y=1.25;g.add(lap);}
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,0.1,14),skin);neck.position.y=1.6;g.add(neck);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.15,28,20),skin);head.position.y=1.78;head.scale.set(0.95,1.08,1);g.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.162,28,20,0,Math.PI*2,0,Math.PI*0.56),hairM);hair.position.set(0,1.8,-0.012);hair.rotation.x=-0.35;hair.scale.set(0.97,1.08,1.02);g.add(hair);
  if(o.bun){const bun=new THREE.Mesh(new THREE.SphereGeometry(0.075,18,14),hairM);bun.position.set(0,1.86,-0.15);g.add(bun);}
  [-0.05,0.05].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.017,10,8),eyeM);e.position.set(x,1.8,0.14);g.add(e);});
  const armGeo=new THREE.CylinderGeometry(0.056,0.046,0.58,14);armGeo.translate(0,-0.29,0);
  const mkArm=x=>{const a=new THREE.Mesh(armGeo,top);a.position.set(x,1.5,0);a.rotation.z=x<0?-0.07:0.07;
    const hand=new THREE.Mesh(new THREE.SphereGeometry(0.055,14,10),skin);hand.position.y=-0.61;a.add(hand);
    const sh=new THREE.Mesh(new THREE.SphereGeometry(0.075,16,12),top);a.add(sh);return a;};
  const armL=mkArm(-0.3),armR=mkArm(0.3);g.add(armL,armR);
  g.userData={legL,legR,armL,armR};return g;
}
function walk(p,t,moving){const a=moving?Math.sin(t*9)*0.45:0;p.userData.legL.rotation.x=a;p.userData.legR.rotation.x=-a;p.userData.armL.rotation.x=-a*0.6;}

/* zones */
zone(0,5,0x1F6F95);zone(7,4.4,0x2B7FA8);zone(15.5,7,0x2F6DB5);zone(23,8.4,0x14A06A);zone(31,4,0x76B900);zone(37,5,0x1F6F95);

/* kiosk */
const kiosk=new THREE.Group();scene.add(kiosk);
const kBody=M(0x1A252C,{roughness:0.45,metalness:0.2});
const kb=new THREE.Mesh(new THREE.BoxGeometry(0.95,0.08,0.75),kBody);kb.position.y=0.04;
const kc=new THREE.Mesh(new THREE.BoxGeometry(0.5,1.0,0.35),kBody);kc.position.y=0.58;
const kHead=new THREE.Group();kHead.position.set(0,1.42,0.05);kHead.rotation.x=-0.28;
const kh=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.7,0.1),kBody);
const kioskCv=makeCanvas(1024,704);
const kScreen=new THREE.Mesh(new THREE.PlaneGeometry(0.9,0.62),new THREE.MeshBasicMaterial({map:kioskCv.t}));kScreen.position.z=0.052;
kHead.add(kh,kScreen);
const tray=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.04,0.32),M(0x33424A));tray.position.set(0,1.02,0.32);
kiosk.add(kb,kc,kHead,tray);
const kLabel=label("Check-in kiosk","Lobby, local network");kLabel.position.set(0,2.55,0);scene.add(kLabel);

/* documents */
function docCanvas(title,scanned,lines){const cv=makeCanvas(512,680);cv.draw((x,w,h)=>{
  x.fillStyle=scanned?"#E9E7DF":"#FFFFFF";x.fillRect(0,0,w,h);
  x.save();if(scanned){x.translate(w/2,h/2);x.rotate(-0.025);x.translate(-w/2,-h/2);}
  x.fillStyle="#16232B";x.font=`600 34px ${SANS}`;x.fillText(title,36,70);
  x.fillStyle="#5B6B73";x.font=`400 22px ${SANS}`;x.fillText("Mary Thomas, MRN 48213",36,108);
  x.strokeStyle="#C9CFCD";x.lineWidth=2;x.beginPath();x.moveTo(36,130);x.lineTo(w-36,130);x.stroke();
  x.fillStyle="#26323A";x.font=`400 22px Georgia, serif`;lines.forEach((l,i)=>x.fillText(l,36,180+i*44));
  x.fillStyle="#D3D8D6";for(let i=0;i<6;i++)x.fillRect(36,380+i*36,w-72-(i%3)*60,10);
  x.restore();
  if(scanned){for(let i=0;i<700;i++){x.fillStyle=`rgba(0,0,0,${Math.random()*0.06})`;x.fillRect(Math.random()*w,Math.random()*h,2,2);}}
});return cv;}
let doc1Cv,doc2Cv;
const doc1=new THREE.Mesh(new THREE.PlaneGeometry(0.42,0.56),new THREE.MeshBasicMaterial({transparent:true,side:THREE.DoubleSide}));
const doc2=doc1.clone();doc2.material=new THREE.MeshBasicMaterial({transparent:true,side:THREE.DoubleSide});
scene.add(doc1,doc2);

/* OCR station */
const OCR_X=7;
const bed=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.9,1.1),M(0x24323A,{roughness:0.5}));bed.position.set(OCR_X,0.45,0);
const glass=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.02,0.9),M(0x7FD3F0,{transparent:true,opacity:0.8,emissive:0x2BA6D6,emissiveIntensity:0.25}));glass.position.set(OCR_X,0.91,0);
const beam=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.03,0.95),new THREE.MeshBasicMaterial({color:0x4FD1FF}));beam.position.set(OCR_X-0.8,0.94,0);
scene.add(bed,glass,beam);
const textCv=makeCanvas(1024,640);
const TP=P(OCR_X,1.85,-0.1);
const textPanel=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.0),new THREE.MeshBasicMaterial({map:textCv.t,transparent:true,side:THREE.DoubleSide}));
textPanel.position.copy(TP);scene.add(textPanel);
const ocrLabel=label("OCR","Paper in, text out");ocrLabel.position.set(OCR_X,3.0,0);scene.add(ocrLabel);
const TEXT_LINES=[
  ["h","summary.txt  (OCR, 91% confidence)"],["l","1  Patient: Mary Thomas, MRN 48213"],["l","2  Continue metformin 500 mg BID."],
  ["l","3  Continue sertraline 50 mg OD."],["l","4  Start Dolo 650 TDS for pain."],
  ["h","prescription.txt  (text layer)"],["l","1  Patient: Mary Thomas, MRN 48213"],["l","2  Metformin 1000 mg BID"],["l","3  Paracetamol 650 mg TDS"]];
let textShown=-1;
function drawText(n){if(n===textShown)return;textShown=n;textCv.draw((x,w,h)=>{
  x.fillStyle="#0E2230";rr(x,0,0,w,h,28);x.fill();let y=60;
  TEXT_LINES.slice(0,n).forEach(([k,s])=>{if(k==="h"){y+=k&&y>60?18:0;x.fillStyle="#4FD1FF";x.font=`500 30px ${MONO}`;}else{x.fillStyle="#E6ECEE";x.font=`400 31px ${MONO}`;}x.fillText(s,44,y);y+=56;});
  if(n===0){x.fillStyle="#6E8796";x.font=`400 30px ${MONO}`;x.fillText("waiting for pages...",44,70);}
});}

/* MongoDB + queue */
const MONGO=P(13,0,-1.3);
const mongoMat=M(0x2F6DB5,{emissive:0x2F6DB5,emissiveIntensity:0,roughness:0.45,metalness:0.15});
for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.85,0.42,40),mongoMat);c.position.set(MONGO.x,0.24+i*0.5,MONGO.z);scene.add(c);}
const conveyor=new THREE.Mesh(new THREE.BoxGeometry(6,0.14,0.9),M(0x2E3A40));conveyor.position.set(15.7,0.72,0.9);scene.add(conveyor);
for(const lx of [13.2,18.2]){const leg=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.66,0.7),M(0x2E3A40));leg.position.set(lx,0.33,0.9);scene.add(leg);}
const mongoLabel=label("MongoDB queue","One row per token");mongoLabel.position.set(15,3.0,-1.2);scene.add(mongoLabel);
const Q=[P(18,1.1,0.9),P(17,1.1,0.9),P(16,1.1,0.9)];
const MONGO_TOP=P(13,1.8,-1.3);

const STATUS={
  pending:{c:"#8A989E",t:"Pending",s:"Text stored, waiting"},
  processing:{c:"#1F5E7A",t:"In sandbox",s:"Being checked"},
  ready:{c:"#B3261E",t:"Ready",s:"3 flags: 2 high, 1 low"},
  closed:{c:"#2E6B4A",t:"Closed",s:"Text purged, audit kept"}};
function card(token){const cv=makeCanvas(512,320);const g=new THREE.Group();
  const back=new THREE.Mesh(new THREE.BoxGeometry(0.86,0.56,0.04),M(0xF4F6F5));
  const face=new THREE.Mesh(new THREE.PlaneGeometry(0.82,0.52),new THREE.MeshBasicMaterial({map:cv.t}));face.position.z=0.022;
  g.add(back,face);g.userData={cv,token,status:null};scene.add(g);return g;}
function setCard(g,status){if(g.userData.status===status)return;g.userData.status=status;const st=STATUS[status];
  g.userData.cv.draw((x,w,h)=>{x.fillStyle="#FFFFFF";x.fillRect(0,0,w,h);x.fillStyle=st.c;x.fillRect(0,0,28,h);
    x.fillStyle="#16232B";x.font=`600 96px ${SANS}`;x.textBaseline="alphabetic";x.fillText(g.userData.token,60,120);
    x.fillStyle=st.c;x.font=`600 40px ${SANS}`;x.fillText(st.t,60,200);
    x.fillStyle="#5B6B73";x.font=`400 30px ${SANS}`;x.fillText(st.s,60,256);});}
const c42=card("T-042"),c43=card("T-043"),c44=card("T-044");

/* sandbox */
const SB_X=23;
const sbMat=new THREE.MeshBasicMaterial({color:0x14A06A,transparent:true,opacity:0.12,depthWrite:false});
const sbBox=new THREE.Mesh(new THREE.BoxGeometry(8,3.2,5),sbMat);sbBox.position.set(SB_X,1.6,0);scene.add(sbBox);
const sbEdgeMat=new THREE.LineBasicMaterial({color:0x19C27F,transparent:true,opacity:1});
const sbEdges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(8,3.2,5)),sbEdgeMat);sbEdges.position.copy(sbBox.position);scene.add(sbEdges);
const sbLabel=label("OpenShell sandbox","No internet, one folder",3);sbLabel.position.set(SB_X,3.75,-0.5);scene.add(sbLabel);
const gateMat=M(0x14A06A,{roughness:0.4});
const gp1=new THREE.Mesh(new THREE.BoxGeometry(0.12,1.9,0.12),gateMat);gp1.position.set(19,0.95,0.2);
const gp2=gp1.clone();gp2.position.z=1.6;

function place(o,v){o.position.copy(v);}
function moveArc(o,a,b,k,h){o.position.lerpVectors(a,b,k);o.position.y+=Math.sin(k*Math.PI)*(h||0);}
function showCards(a,b,c){c42.visible=a;c43.visible=b;c44.visible=c;}

function reset(s){
  mary.position.set(0,0,s>=7?2.3:s>=1?1.25:5.2);if(s>=7)mary.position.x=34.4;mary.rotation.y=Math.PI;walk(mary,0,false);
  mary.userData.armR.rotation.x=0;
  [doc1,doc2].forEach(d=>{d.visible=false;d.material.opacity=1;d.scale.set(1,1,1);d.rotation.set(0,0,0);});
  textPanel.visible=false;textPanel.scale.set(1,1,1);place(textPanel,TP);drawText(0);
  beam.visible=s===2;beam.position.x=OCR_X-0.8;
  c42.scale.set(1,1,1);showCards(false,false,false);
  if(s>=4){showCards(true,true,true);place(c42,Q[0]);place(c43,Q[1]);place(c44,Q[2]);setCard(c42,"pending");setCard(c43,"pending");setCard(c44,"pending");}
  if(s>=5){place(c42,CASE);setCard(c42,"processing");place(c43,Q[0]);place(c44,Q[1]);}
  if(s===6){result.visible=true;setCard(c42,"ready");}
  if(s>=7){place(c42,MONGO_TOP);setCard(c42,"ready");place(c43,CASE);setCard(c43,"processing");place(c44,Q[0]);}
  if(s>=8)setCard(c42,"closed");
  if(s===3){textPanel.visible=true;drawText(9);}
  if(s!==6)result.visible=false;
  particle.visible=false;msg.visible=false;deletedTag.visible=false;loopLines.forEach(l=>l.visible=s===5);
  mongoMat.emissiveIntensity=0;sbEdgeMat.opacity=1;
  drawKiosk(s===0?"welcome":s===1?"upload":"token");
  drawMon(s>=8?"closed":s>=7?"flags":"idle");
  drawBoard(s>=7?"T-042":"T-041");
}

function update(s,t){
  if(s===0){const k=seg(t,0.4,3.6);mary.position.z=lerp(5.2,1.25,k);walk(mary,t,k>0&&k<1);}
  else if(s===1){
    mary.userData.armR.rotation.x=-1.0*seg(t,0,0.6)*(1-seg(t,2.2,2.8));
    const vis=t<2.9;doc1.visible=doc2.visible=vis;
    const k=seg(t,0.8,2.2);
    moveArc(doc1,P(0.05,1.25,0.95),P(-0.15,1.07,0.32),k,0.15);moveArc(doc2,P(0.3,1.25,0.95),P(0.15,1.07,0.32),k,0.15);
    doc1.rotation.x=doc2.rotation.x=-1.45*k;
    const sc=1-seg(t,2.2,2.85)*0.98;doc1.scale.set(sc,sc,sc);doc2.scale.set(sc,sc,sc);
    drawKiosk(t<2.7?"upload":"token");
  }
  else if(s===2){
    doc1.visible=doc2.visible=true;const k=seg(t,0,1.7);
    moveArc(doc1,P(-0.15,1.07,0.32),P(OCR_X-0.32,0.94,0),k,1.4);moveArc(doc2,P(0.15,1.07,0.32),P(OCR_X+0.32,0.94,0),k,1.4);
    doc1.rotation.x=doc2.rotation.x=-Math.PI/2;
    if(t>1.7&&t<5.6){beam.visible=true;beam.position.x=OCR_X-0.8+(((t-1.7)/1.3)%1)*1.6;}else beam.visible=false;
    textPanel.visible=t>1.9;drawText(Math.floor(seg(t,1.9,5)*9+0.001));
    const op=1-seg(t,3.8,5.6);doc1.material.opacity=doc2.material.opacity=op;doc1.visible=doc2.visible=op>0.01;
  }
  else if(s===3){
    const k=seg(t,0.3,1.8);textPanel.visible=t<1.8;moveArc(textPanel,TP,Q[0],k,1.2);const sc=lerp(1,0.4,k);textPanel.scale.set(sc,sc,sc);
    if(t>=1.8){c42.visible=true;place(c42,Q[0]);setCard(c42,"pending");const p=0.6+0.4*seg(t,1.8,2.3);c42.scale.set(p,p,p);}
    mongoMat.emissiveIntensity=t>1.6&&t<3?0.3*(1+Math.sin(t*10)):0;
    if(t>=2.3){c43.visible=true;setCard(c43,"pending");moveArc(c43,P(13.5,1.1,0.9),Q[1],seg(t,2.3,3.4),0);}
    if(t>=3.4){c44.visible=true;setCard(c44,"pending");moveArc(c44,P(13.5,1.1,0.9),Q[2],seg(t,3.4,4.5),0);}
  }
  else if(s===4){
    moveArc(c42,Q[0],CASE,seg(t,0.6,2.6),1.0);
    moveArc(c43,Q[1],Q[0],seg(t,1.2,2.6),0);moveArc(c44,Q[2],Q[1],seg(t,1.2,2.6),0);
    if(t>2.6)setCard(c42,"processing");
    sbEdgeMat.opacity=t>2.2&&t<3.6?0.5+0.5*Math.abs(Math.sin(t*8)):1;
  }
  else if(s===5){
    const L=13.5,lt=t%L,i=Math.floor(lt/1.5);
    if(i<8){const u=(lt-i*1.5)/1.5;const p=LOOP[i].c.getPointAt(ease(u));particle.visible=true;particle.position.copy(p);
      msg.visible=true;msg.position.set(p.x,p.y+0.42,p.z);drawMsg(LOOP[i].m);result.visible=false;
    }else{particle.visible=false;msg.visible=false;if(!result.visible){drawResult();result.visible=true;}}
    nmMesh.material.emissiveIntensity=(i===1||i===2||i===6||i===7)?0.35:0.12;
    setSub(i<8?i:8);
  }
  else if(s===6){
    if(t>0.9)result.visible=false;
    moveArc(c42,CASE,MONGO_TOP,seg(t,1,3.2),2.2);
    deletedTag.visible=t>2.6&&t<6.5;
    moveArc(c43,Q[0],CASE,seg(t,3.6,5.2),1.0);if(t>5.2)setCard(c43,"processing");
    moveArc(c44,Q[1],Q[0],seg(t,3.6,5.2),0);
  }
  else if(s===7){const k=seg(t,0.2,2.8);mary.position.x=lerp(34.4,37.5,k);mary.position.z=lerp(2.3,1.45,k);walk(mary,t,k>0&&k<1);}
  nmMesh.rotation.y+=0.004;nmMesh.rotation.x+=0.002;
}

/* ---------- panel ---------- */
const $=id=>document.getElementById(id);
STAGES.forEach((_,i)=>{const b=document.createElement("button");b.setAttribute("aria-label",`Stage ${i+1}: ${STAGES[i].t}`);b.onclick=()=>go(i);$("dots").appendChild(b);});
function setSub(i){if(i===activeSub)return;activeSub=i;const lis=document.querySelectorAll("ol.steps li");lis.forEach((li,j)=>li.className=j===i?"on":"");}
function panel(){const S=STAGES[stage];$("count").textContent=`${stage+1} of ${STAGES.length}`;$("where").textContent=S.w;$("docstage").textContent=`Doc: ${S.d}`;
  $("ttl").textContent=S.t;$("body").textContent=S.b;
  $("extra").innerHTML=S.loop?`<ol class="steps">${SUBSTEPS.map(s=>`<li>${s}</li>`).join("")}</ol>`:S.x;activeSub=-1;
  [...$("dots").children].forEach((b,i)=>b.setAttribute("aria-current",i===stage));
  $("prev").disabled=stage===0;$("next").disabled=stage===STAGES.length-1;}
function go(s){stage=Math.max(0,Math.min(STAGES.length-1,s));stageStart=performance.now();reset(stage);panel();}
function setPlaying(p){playing=p;$("play").textContent=p?"Pause":"Play";}
$("prev").onclick=()=>go(stage-1);$("next").onclick=()=>go(stage+1);
$("play").onclick=()=>{if(!playing&&stage===STAGES.length-1)go(0);setPlaying(!playing);};
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(stage+1);if(e.key==="ArrowLeft")go(stage-1);if(e.key===" "){e.preventDefault();$("play").click();}});

/* ---------- theme + resize ---------- */
function theme(){const d=isDark();scene.background=new THREE.Color(d?0x0B1115:0xDCE4E2);floorMat.color.set(d?0x1B262C:0xC5D1CE);railMat.color.set(d?0x6FB3D2:0x0E4A66);}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",theme);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener("resize",resize);

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-last)/1000);last=now;
  const t=(now-stageStart)/1000;update(stage,t);
  const [pos,look]=STAGES[stage].cam;const f=camera.aspect<0.9?1.65:camera.aspect<1.3?1.25:1;
  const tp=look.clone().add(pos.clone().sub(look).multiplyScalar(f));
  if(!camInit){camPos.copy(tp);camLook.copy(look);camInit=true;}
  const k=1-Math.exp(-dt*2.6);camPos.lerp(tp,k);camLook.lerp(look,k);
  camera.position.copy(camPos);camera.lookAt(camLook);
  renderer.render(scene,camera);
  if(playing&&t>STAGES[stage].dur){if(stage<STAGES.length-1)go(stage+1);else setPlaying(false);}
}

function enableShadows(){scene.traverse(o=>{if(o.isMesh&&!o.material.isMeshBasicMaterial&&o!==floor){o.castShadow=true;o.receiveShadow=true;}});floor.receiveShadow=true;}
function start(){enableShadows();doc1Cv=docCanvas("Discharge summary",true,["Continue metformin 500 mg BID.","Continue sertraline 50 mg OD.","Start Dolo 650 TDS for pain."]);
  doc2Cv=docCanvas("Prescription",false,["Metformin 1000 mg BID","Paracetamol 650 mg TDS"]);
  doc1.material.map=doc1Cv.t;doc2.material.map=doc2Cv.t;doc1.material.needsUpdate=doc2.material.needsUpdate=true;
  drawResult();theme();resize();setPlaying(playing);go(0);requestAnimationFrame(frame);}
const fontsReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontsReady.then(()=>{
  /* labels were drawn before fonts loaded; rebuild their textures now */
  scene.traverse(o=>{if(o.isSprite&&o.userData.cv&&o.userData.redraw)o.userData.redraw();});
  start();});
})();
</script>
