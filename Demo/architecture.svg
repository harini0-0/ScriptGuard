<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title   { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub     { font-size: 14px; fill: #475569; }
      .zone    { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
      .box     { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .small   { font-size: 11.5px; fill: #64748b; }
      .flow    { font-size: 11.5px; fill: #475569; font-weight: 600; }
      .pill    { font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1180" height="780" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="46" class="title">ScriptGuard — system architecture</text>
  <text x="40" y="70" class="sub">Everything runs on one Dell Pro Max (GB10), fully offline. Patient data never leaves the machine.</text>

  <!-- ============ OUTER MACHINE BOUNDARY ============ -->
  <rect x="30" y="92" width="1120" height="610" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="48" y="80" width="470" height="26" rx="13" fill="#0f172a"/>
  <text x="62" y="98" class="pill" fill="#ffffff">Dell Pro Max · GB10  —  single machine · no internet · 127.0.0.1</text>

  <!-- ============ HOST ZONE ============ -->
  <rect x="56" y="126" width="560" height="556" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="76" y="152" class="zone" fill="#15803d">HOST  ·  holds identifiers, DB, dashboard</text>

  <!-- Intake -->
  <rect x="76" y="170" width="235" height="78" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
  <text x="90" y="194" class="box">1 · Intake (discharge desk)</text>
  <text x="90" y="214" class="small">Upload discharge summary + prescription</text>
  <text x="90" y="230" class="small">PDF · scan · photo · pasted text</text>

  <!-- Reader -->
  <rect x="76" y="266" width="235" height="78" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
  <text x="90" y="290" class="box">2 · Reader</text>
  <text x="90" y="310" class="small">pdfplumber (text layer)</text>
  <text x="90" y="326" class="small">Tesseract OCR (scans &amp; photos)</text>

  <!-- MongoDB -->
  <rect x="76" y="362" width="235" height="72" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
  <text x="90" y="386" class="box">3 · MongoDB store</text>
  <text x="90" y="406" class="small">One token per patient</text>
  <text x="90" y="422" class="small">Bound to 127.0.0.1 only</text>

  <!-- Redactor -->
  <rect x="76" y="452" width="235" height="72" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="90" y="476" class="box">4 · Redactor</text>
  <text x="90" y="496" class="small">Strip name, MRN, DOB, address,</text>
  <text x="90" y="512" class="small">phone, email — keep medicines</text>

  <!-- Python checks engine -->
  <rect x="331" y="266" width="265" height="168" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
  <text x="345" y="290" class="box">6 · Python checks engine</text>
  <text x="345" y="309" class="small">No AI — deterministic &amp; auditable</text>
  <rect x="345" y="320" width="237" height="26" rx="6" fill="#f1f5f9"/>
  <text x="356" y="337" class="small">ground() — trace every value to source</text>
  <rect x="345" y="352" width="237" height="26" rx="6" fill="#f1f5f9"/>
  <text x="356" y="369" class="small">compare() — dose · stopped · missing · freq</text>
  <rect x="345" y="384" width="237" height="26" rx="6" fill="#f1f5f9"/>
  <text x="356" y="401" class="small">decide() — HELD · NEEDS_REVIEW · CLEAN</text>

  <!-- Pharmacist dashboard -->
  <rect x="331" y="452" width="265" height="72" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
  <text x="345" y="476" class="box">7 · Pharmacist dashboard</text>
  <text x="345" y="496" class="small">Flags side by side, ranked by severity</text>
  <text x="345" y="512" class="small">Pharmacist decides · board view</text>

  <!-- cleanup -->
  <rect x="76" y="548" width="520" height="52" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="90" y="570" class="box">8 · After the decision</text>
  <text x="90" y="589" class="small">Every copy of the patient's data is deleted. A content-free audit line is kept.</text>

  <!-- ============ SANDBOX ZONE ============ -->
  <rect x="648" y="126" width="478" height="556" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="668" y="152" class="zone" fill="#b91c1c">OpenShell SANDBOX  ·  no internet · no DB access</text>
  <text x="668" y="172" class="small">Only this one patient's redacted text is ever inside.</text>

  <!-- OpenClaw agent -->
  <rect x="668" y="196" width="438" height="150" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="684" y="220" class="box">5 · OpenClaw agent</text>
  <text x="684" y="240" class="small">Runs the scriptguard SKILL.md — extract only, never judge</text>
  <rect x="684" y="252" width="406" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="698" y="274" class="box" fill="#1d4ed8">Nemotron  (local LLM via Ollama)</text>
  <text x="698" y="294" class="small">Reads both documents, lists every medicine with its</text>
  <text x="698" y="310" class="small">exact source line → JSON. Does no dose math.</text>
  <text x="698" y="326" class="small">SCRIPTGUARD_LLM_MODEL · 127.0.0.1:11434</text>

  <!-- sandbox tools -->
  <rect x="668" y="362" width="211" height="92" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="684" y="386" class="box">sg_read.py</text>
  <text x="684" y="406" class="small">Hands the agent the</text>
  <text x="684" y="422" class="small">case text to read</text>

  <rect x="895" y="362" width="211" height="92" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="911" y="386" class="box">sg_check.py</text>
  <text x="911" y="406" class="small">Calls the Python engine</text>
  <text x="911" y="422" class="small">on the extracted JSON</text>

  <!-- NemoClaw provisioning band -->
  <rect x="668" y="476" width="438" height="124" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="684" y="500" class="box" fill="#6d28d9">NemoClaw  ·  provisioning &amp; orchestration</text>
  <text x="684" y="522" class="small">• Mounts the shared folder into the sandbox</text>
  <text x="684" y="540" class="small">• Installs the scriptguard skill:  nemoclaw &lt;name&gt; skill install …</text>
  <text x="684" y="558" class="small">• Connects OpenClaw to the local Nemotron model</text>
  <text x="684" y="576" class="small">• Sets up the whole offline stack on the GB10</text>

  <!-- ============ FLOW ARROWS ============ -->
  <!-- intake -> reader -->
  <line x1="193" y1="248" x2="193" y2="264" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- reader -> mongo -->
  <line x1="193" y1="344" x2="193" y2="360" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- mongo -> redact -->
  <line x1="193" y1="434" x2="193" y2="450" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- redact -> sandbox (cross boundary, blue = the only patient data that crosses) -->
  <path d="M193 524 L193 636 L636 636 L636 266 L666 266" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <text x="300" y="628" class="flow" fill="#1d4ed8">redacted text — one patient only →</text>

  <!-- agent extract -> back to python engine -->
  <path d="M666 300 L598 300" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <text x="604" y="292" class="flow" fill="#1d4ed8">← extracted JSON</text>

  <!-- engine -> dashboard -->
  <line x1="463" y1="434" x2="463" y2="450" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- dashboard -> cleanup -->
  <line x1="400" y1="524" x2="360" y2="546" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- agent uses tools -->
  <line x1="773" y1="346" x2="773" y2="360" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="1000" y1="346" x2="1000" y2="360" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="40" y="716" width="18" height="12" rx="2" fill="#2563eb"/>
  <text x="64" y="726" class="small">Patient data crossing a boundary (redacted)</text>
  <rect x="330" y="716" width="18" height="12" rx="2" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="354" y="726" class="small">Host (trusted)</text>
  <rect x="470" y="716" width="18" height="12" rx="2" fill="#fef2f2" stroke="#dc2626"/>
  <text x="494" y="726" class="small">Sandbox (isolated)</text>
  <rect x="610" y="716" width="18" height="12" rx="2" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="634" y="726" class="small">NemoClaw (orchestration)</text>
  <rect x="790" y="716" width="18" height="12" rx="2" fill="#eff6ff" stroke="#2563eb"/>
  <text x="814" y="726" class="small">Nemotron LLM (reads, never decides)</text>
</svg>
